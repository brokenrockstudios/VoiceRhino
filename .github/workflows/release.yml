# Builds the portable Windows zip on every version tag and attaches it to a DRAFT release.
# Publishing the draft (by hand, on GitHub) is what makes "Check for updates" see it.
#
#   git tag v0.1.3 && git push origin v0.1.3
#
# Or run it from the Actions tab (workflow_dispatch) to get the zip as a build artifact only.

name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the draft release and upload the zip

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's TEMP is a short 8.3 path (C:\Users\RUNNER~1\...), which breaks compiling
      # PyInstaller's bootloader (its build tool mixes short and long paths). Use the runner's
      # own temp folder for every later step.
      - name: Use a temp folder without short names
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false

      - name: Install Python and packages (CPU only, no GPU extra)
        run: |
          uv python install 3.12
          uv sync --group build

      # PyInstaller's prebuilt launcher is shared by every PyInstaller app, including malware,
      # which is the main cause of antivirus false alarms. Compile our own from the same version.
      - name: Compile the PyInstaller bootloader
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $version = uv run --no-sync python -c "import PyInstaller; print(PyInstaller.__version__)"
          uv pip install --reinstall --no-binary pyinstaller --no-cache "pyinstaller==$version"

      - name: Quick tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider tests/test_updates.py tests/test_updater.py tests/test_gpu_addon.py tests/test_config.py

      - name: Build
        run: uv run --no-sync python packaging/build.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist/VoiceRhino/VoiceRhino.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: VoiceRhino-win64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "VoiceRhino $($tag.TrimStart('v'))" --notes "See CHANGELOG.md."
          }
          gh release upload $tag (Get-ChildItem dist/*.zip, dist/*.sha256) --clobber
