[project]
name = "voicerhino"
version = "0.1.2"
description = "Lightweight standalone live captions for Windows: any audio device or app, click-through overlays, scrollback history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Broken Rock Studios LLC", email = "support@brokenrockstudios.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
    "PySide6-Essentials>=6.7",
    "PyAudioWPatch>=0.2.12",
    "soxr>=0.5",
    "comtypes>=1.4",
    "psutil>=6",
    # Offline translation (Settings > Translation): Opus-MT models run in CTranslate2.
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
# GPU Whisper via CTranslate2. Off by default: the CPU models are the low-impact path.
gpu = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
voicerhino = "voicerhino.__main__:main"

[project.gui-scripts]
voicerhino-gui = "voicerhino.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicerhino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
